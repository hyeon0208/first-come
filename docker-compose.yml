# 컨테이너 상한은 부하 측정 조건이다. 바꾸면 load/results의 수치도 다시 잰다.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: firstcome
      MYSQL_USER: firstcome
      MYSQL_PASSWORD: firstcome
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql
    # 호스트에서 백엔드를 직접 띄울 때(local 프로필) 붙을 수 있게 이 컴퓨터에만 연다.
    ports:
      - "127.0.0.1:3306:3306"
    cpus: 2.0
    mem_limit: 1g

  payment-mock:
    build:
      context: .
      dockerfile: payment-mock/Dockerfile
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    # 사용자가 직접 부를 일이 없다. 확인용으로 이 컴퓨터에만 연다.
    ports:
      - "127.0.0.1:8081:8081"
    cpus: 1.0
    mem_limit: 512m

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:mysql://mysql:3306/firstcome
      DATABASE_USERNAME: firstcome
      DATABASE_PASSWORD: firstcome
      PAYMENT_BASE_URL: http://payment-mock:8081
      # 동시에 진행되는 연습 수의 상한. 부하를 잴 때만 올린다(load/run-baseline.sh).
      BOOKING_MAX_ACTIVE_PERFORMANCES: ${BOOKING_MAX_ACTIVE_PERFORMANCES:-10}
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      payment-mock:
        condition: service_started
    cpus: 2.0
    mem_limit: 1g

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    cpus: 0.5
    mem_limit: 128m

volumes:
  mysql-data:
