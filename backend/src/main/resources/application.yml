spring:
  application:
    name: first-come-practice
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
