spring:
  application:
    name: first-come-practice
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true
  http:
    clients:
      # 결제 서버를 부를 때 기다리는 시간. 응답 대기를 넘기면 결제 결과를 모르는 것으로 보고 취소를 보낸다.
      connect-timeout: 2s
      read-timeout: 5s
  datasource:
    hikari:
      # 좌석을 범위로 UPDATE하는 문장이 인덱스 빈 구간을 잠가 교착하지 않도록 READ COMMITTED로 실행한다.
      transaction-isolation: TRANSACTION_READ_COMMITTED

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

# 예매 규칙. 값의 출처는 예매 규칙 표다.
booking:
  # 예매 화면에 들어온 순간부터 좌석을 고를 수 있는 시간
  seat-selection-duration: 10m
  # 첫 좌석을 누른 순간부터 가선점이 유지되는 시간
  preselect-duration: 7m
  # 선택 완료부터 결제를 끝내야 하는 시간
  hold-duration: 7m
  # 한 회차에서 한 참가자가 가져갈 수 있는 매수
  max-seats: 4
  # 연습 시작부터 예매 오픈까지
  open-delay: 10s
  # 공연 시작 시각: 회차를 만든 날로부터 이 일수 뒤 18:00
  show-start-days: 30
  # 오픈 뒤 이 시간 안에 입장하지 않은 회차는 중단으로 끝낸다
  enter-grace: 10m
  # 예매 가능 시간이 끝난 뒤에도 결제 중이면 결제 결과를 기다리는 시간
  paying-grace: 1m
  # 끝난 회차의 좌석과 예매 데이터를 지우기까지
  purge-delay: 10m
  # 동시에 진행되는 회차 수의 상한. 기준 부하 측정(load/results/2026-11-25-baseline.md)에서
  # 어려움 난이도 5개까지는 응답이 3초 안이었고 10개부터 커넥션 풀 대기가 쌓였다.
  max-active-performances: 5
  # 방치된 회차를 끝내고 끝난 회차를 지우는 작업의 주기
  sweep-interval: PT5S
  sweep-enabled: true

# 가상 경쟁자. 예매 오픈 시각부터 arrival-window에 걸쳐 고르게 들어와, 한 명이 1~4석(평균 2.5석)을 사용자와 같은 경로로 가져간다.
competitor:
  enabled: true
  # 좌석 하나를 누르고 다음 좌석을 누르기까지
  press-interval-min: 150ms
  press-interval-max: 450ms
  # 선택 완료 뒤 결제를 누르기까지
  checkout-delay-min: 500ms
  checkout-delay-max: 1500ms
  # 좌석은 1,008석이다. sold-out-seconds는 화면에 보여 주는 매진까지의 대략적인 시간이고, 비우면 매진되지 않는 난이도다.
  # 값은 가상 경쟁자만 돌려 잰 것이다(DifficultyCalibrationTest, 2026-11-25에 두 번: 보통 98.7초·93.4초, 어려움 10.6초·10.3초).
  difficulties:
    easy:
      count: 200
      arrival-window: 5m
      sold-out-seconds:
    normal:
      count: 500
      arrival-window: 2m
      sold-out-seconds: 100
    hard:
      count: 1000
      arrival-window: 25s
      sold-out-seconds: 10

reservation:
  # 장당 예매수수료
  fee-per-ticket: 2000

session:
  cookie-secure: false
